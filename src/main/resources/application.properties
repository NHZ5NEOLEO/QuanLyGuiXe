spring.application.name=QuanLyGuiXe
# ===============================
# CẤU HÌNH KẾT NỐI SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyGuiXe;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=10112005hue@!
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
server.port=80
# ===============================
# CẤU HÌNH HIBERNATE / JPA
# ===============================
# Tự động cập nhật cấu trúc bảng trong CSDL khi có thay đổi trong code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Hiển thị câu lệnh SQL trên console để dễ debug
spring.jpa.show-sql=true
# Định dạng câu lệnh SQL cho dễ nhìn
spring.jpa.properties.hibernate.format_sql=true

# Tắt cache Thymeleaf để reload giao diện tức thì khi F5 trình duyệt
spring.thymeleaf.cache=false