spring.application.name=QuanLyGuiXe

# Tự động nạp cấu hình cục bộ từ file ngoài repository nếu có
spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties

# ===============================
# CẤU HÌNH KẾT NỐI SQL SERVER (DÙNG BIẾN MÔI TRƯỜNG AN TOÀN)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QuanLyGuiXe;encrypt=true;trustServerCertificate=true;}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
server.port=80

# ===============================
# CẤU HÌNH HIBERNATE / JPA
# ===============================
# Tự động cập nhật cấu trúc bảng trong CSDL an toàn
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tắt cache Thymeleaf để reload giao diện tức thì khi F5 trình duyệt
spring.thymeleaf.cache=false

# ===============================
# CẤU HÌNH BẢO ĐẢM UTF-8 TOÀN DIỆN
# ===============================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true

# ===============================
# CẤU HÌNH MAILBOX.ORG SMTP
# ===============================
spring.mail.host=smtp.mailbox.org
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:huter@mailbox.org}
spring.mail.password=${SPRING_MAIL_PASSWORD:10112005Hue@!}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
