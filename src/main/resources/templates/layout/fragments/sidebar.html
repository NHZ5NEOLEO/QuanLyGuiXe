<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Fragment</title>
</head>
<body>

<!-- ========================================================================= -->
<!-- SIDEBAR NAVIGATION FRAGMENT (UI/UX Pro Max Standard)                      -->
<!-- ========================================================================= -->
<aside th:fragment="sidebar" class="app-sidebar" role="navigation" aria-label="Điều hướng chính">
    <!-- Brand Header -->
    <div class="sidebar-brand">
        <div class="brand-icon-box">
            <i class="fa-solid fa-square-parking" aria-hidden="true"></i>
        </div>
        <div class="brand-text">
            <div class="d-flex align-items-center gap-2">
                <span class="title">PARKING</span>
                <span class="badge sidebar-role-badge"
                      th:classappend="${session.userRole == 'NHAN_VIEN'} ? 'bg-success text-white' : 'bg-primary text-white'"
                      th:text="${session.userRole != null ? (session.userRole == 'NHAN_VIEN' ? 'NHÂN VIÊN' : session.userRole) : 'ADMIN'}">ADMIN</span>
            </div>
            <div class="subtitle">Hệ thống quản lý bãi xe</div>
        </div>
        <!-- Close button on mobile -->
        <button type="button" class="btn btn-sm text-secondary d-lg-none ms-auto border-0 p-1" onclick="toggleMobileSidebar(false)" aria-label="Đóng menu">
            <i class="fa-solid fa-xmark fs-5 text-white" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div class="sidebar-nav">
        <!-- Chức năng nghiệp vụ chính -->
        <div class="nav-section-title" th:text="${session.userRole == 'NHAN_VIEN' ? 'Nghiệp vụ trực cổng' : 'Chức năng chính'}">Chức năng chính</div>

        <!-- 1. Tổng quan (Chỉ dành cho ADMIN) -->
        <a th:if="${session.userRole == null or session.userRole == 'ADMIN'}" 
           th:href="@{/tong-quan}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''" class="sidebar-link" title="Xem tổng quan tình hình bãi xe">
            <i class="fa-solid fa-chart-pie text-primary" aria-hidden="true"></i>
            <span>Tổng quan</span>
        </a>

        <!-- 2. Xe vào (Bắt buộc cho nhân viên trực cổng & Admin) -->
        <a th:href="@{/gui-xe}" th:classappend="${activePage == 'check-in' or (activePage == 'gate' and (activeTab == 'checkin' or activeTab == null))} ? 'active' : ''" class="sidebar-link" title="Ghi nhận phương tiện vào bãi và tạo vé QR">
            <i class="fa-solid fa-arrow-right-to-bracket text-success" aria-hidden="true"></i>
            <span>Xe vào</span>
        </a>

        <!-- 3. Xe ra (Bắt buộc cho nhân viên trực cổng & Admin) -->
        <a th:href="@{/xe-ra}" th:classappend="${activePage == 'check-out' or (activePage == 'gate' and activeTab == 'checkout')} ? 'active' : ''" class="sidebar-link" title="Tra cứu vé, tính tiền và nhận xe ra">
            <i class="fa-solid fa-arrow-right-from-bracket text-warning" aria-hidden="true"></i>
            <span>Xe ra</span>
        </a>

        <!-- 4. Xe đang trong bãi (Cần thiết để kiểm tra số xe tồn & chỗ trống) -->
        <a th:href="@{/xe-trong-bai}" th:classappend="${activePage == 'active-vehicles'} ? 'active' : ''" class="sidebar-link" title="Danh sách các xe đang đỗ trong bãi">
            <i class="fa-solid fa-car-side text-primary" aria-hidden="true"></i>
            <span>Xe đang trong bãi</span>
        </a>

        <!-- 5. Quản lý / Tra cứu vé xe -->
        <a th:href="@{/ve-xe}" th:classappend="${activePage == 'tickets' or activePage == 'history'} ? 'active' : ''" class="sidebar-link" th:title="${session.userRole == 'NHAN_VIEN' ? 'Tra cứu thông tin vé khi khách quên vé/mất vé' : 'Danh sách, tra cứu và in vé xe'}">
            <i class="fa-solid fa-ticket text-info" aria-hidden="true"></i>
            <span th:text="${session.userRole == 'NHAN_VIEN' ? 'Tra cứu vé xe' : 'Quản lý vé xe'}">Quản lý vé xe</span>
        </a>

        <!-- 6. Quản lý phương tiện (Chỉ dành cho ADMIN) -->
        <a th:if="${session.userRole == null or session.userRole == 'ADMIN'}"
           th:href="@{/phuong-tien}" th:classappend="${activePage == 'vehicles'} ? 'active' : ''" class="sidebar-link" title="Quản lý danh mục phương tiện và hồ sơ xe">
            <i class="fa-solid fa-car text-primary" aria-hidden="true"></i>
            <span>Quản lý phương tiện</span>
        </a>

        <!-- 7. Thống kê & Báo cáo (Chỉ dành cho ADMIN) -->
        <a th:if="${session.userRole == null or session.userRole == 'ADMIN'}"
           th:href="@{/thong-ke}" th:classappend="${activePage == 'reports'} ? 'active' : ''" class="sidebar-link" title="Báo cáo doanh thu, lượt xe và biểu đồ phân tích">
            <i class="fa-solid fa-chart-line text-success" aria-hidden="true"></i>
            <span>Thống kê & Báo cáo</span>
        </a>

        <!-- Nhóm Kết ca & Bàn giao hoặc Tiện ích & Cấu hình -->
        <div class="nav-section-title" th:text="${session.userRole == 'NHAN_VIEN' ? 'Kết ca trực' : 'Tiện ích & Cấu hình'}">Tiện ích & Cấu hình</div>

        <!-- 8. Bàn giao ca trực (Cả ADMIN & NHAN_VIEN) -->
        <a th:href="@{/ca-truc}" th:classappend="${activePage == 'shift' or activePage == 'ca-truc'} ? 'active' : ''" class="sidebar-link" title="Bàn giao ca trực và kiểm đếm tiền thu trong ca">
            <i class="fa-solid fa-clipboard-user text-warning" aria-hidden="true"></i>
            <span>Bàn giao ca trực</span>
        </a>

        <!-- 9. Bảng giá gửi xe (Chỉ dành cho ADMIN) -->
        <a th:if="${session.userRole == null or session.userRole == 'ADMIN'}" 
           th:href="@{/bang-gia}" th:classappend="${activePage == 'price-settings'} ? 'active' : ''" class="sidebar-link" title="Cấu hình biểu giá gửi xe">
            <i class="fa-solid fa-tags" aria-hidden="true"></i>
            <span>Bảng giá gửi xe</span>
        </a>

        <!-- 10. Quản lý nhân viên (Chỉ dành cho ADMIN) -->
        <a th:if="${session.userRole == null or session.userRole == 'ADMIN'}" 
           th:href="@{/nhan-vien}" th:classappend="${activePage == 'staff'} ? 'active' : ''" class="sidebar-link" title="Quản lý tài khoản nhân viên bảo vệ">
            <i class="fa-solid fa-users-gear" aria-hidden="true"></i>
            <span>Quản lý nhân viên</span>
        </a>
    </div>

    <!-- Sidebar User Footer -->
    <div class="sidebar-user-footer">
        <div class="sidebar-user-info">
            <div class="user-avatar-circle" th:text="${session.userName != null ? #strings.substring(session.userName, 0, 1).toUpperCase() : 'A'}">
                A
            </div>
            <div class="sidebar-user-text">
                <div class="sidebar-user-name" th:text="${session.userName != null ? session.userName : 'Admin Quản Trị'}">Admin Quản Trị</div>
                <div class="sidebar-user-role" th:text="${session.userRole != null ? (session.userRole == 'NHAN_VIEN' ? 'NHÂN VIÊN TRỰC CỔNG' : session.userRole) : 'QUẢN TRỊ VIÊN'}">ADMIN</div>
            </div>
        </div>
        <a th:href="@{/logout}" class="btn-pro btn-outline-pro btn-sm-pro py-1 px-2 text-danger border-0" title="Đăng xuất" aria-label="Đăng xuất">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </a>
    </div>
</aside>

</body>
</html>
