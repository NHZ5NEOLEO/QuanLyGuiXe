<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
</head>
<body>

<!-- Reusable Enterprise Operational Footer Fragment -->
<footer th:fragment="footer" class="app-footer border-top bg-white py-3 px-4 mt-auto">
    <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-2 small text-muted">
        <div class="d-flex align-items-center gap-2">
            <span class="system-status-indicator" title="Kết nối máy chủ trực tuyến ổn định">
                <span class="status-pulse-dot"></span>
                <span class="fw-semibold text-dark">Hệ thống vận hành trực tuyến</span>
            </span>
            <span class="text-secondary d-none d-sm-inline">|</span>
            <span class="d-none d-sm-inline">Đề tài: <b>Xây Dựng Phần Mềm Quản Lý Gửi Xe</b></span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span>Phiên bản: <code class="text-primary fw-semibold">v2.0</code></span>
            <span>Trạng thái: <b class="text-success">Trực tuyến</b></span>
        </div>
    </div>
</footer>

</body>
</html>
