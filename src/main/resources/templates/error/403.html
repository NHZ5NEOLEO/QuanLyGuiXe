<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Quyền Truy Cập Bị Từ Chối - PARKING</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom Design System -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .error-card {
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: var(--danger);
            line-height: 1;
            letter-spacing: -1px;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="mb-3">
        <span class="badge bg-danger text-white px-3 py-1 fw-bold">
            <i class="fa-solid fa-shield-halved me-1"></i> BẢO MẬT & PHÂN QUYỀN
        </span>
    </div>

    <div class="error-code my-2">403</div>
    <h1 class="h4 fw-bold text-dark mb-2">Quyền Truy Cập Bị Từ Chối</h1>
    <p class="text-muted small mb-4">
        Tài khoản của bạn không có đủ đặc quyền để truy cập trang này. Vui lòng liên hệ Quản trị viên (ADMIN) hoặc quay lại khu vực làm việc của bạn.
    </p>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mb-4">
        <a href="/gate" class="btn-pro btn-outline-pro">
            <i class="fa-solid fa-traffic-light"></i> Bàn Trực Cổng (Gate)
        </a>
        <a href="/login" class="btn-pro btn-primary-pro">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập Lại
        </a>
    </div>

    <div class="pt-3 border-top text-muted small d-flex justify-content-between align-items-center">
        <span>Hotline hỗ trợ: <b>1900 6868</b></span>
        <a href="/" class="text-decoration-none text-muted">Trang chủ</a>
    </div>
</div>

</body>
</html>
